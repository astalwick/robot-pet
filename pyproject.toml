[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-pet"
version = "0.1.0"
description = "Raspberry Pi robot controller services and tools"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "basicmicro",
    "evdev; sys_platform == 'linux'",
    "gpiozero",
    "numpy",
    "openai",
    "pyserial",
    "pyusb",
    "rich",
    "certifi",
    "sounddevice",
    "textual",
    "websockets",
    "openwakeword>=0.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["config", "control", "drivers", "lib", "telemetry", "voice"]
py-modules = ["gamepad_teleop", "robot_brain", "robot_camera", "robot_dashboard", "robot_telemetry", "robot_vision", "robot_voice", "robot_web_dashboard"]
