# Nav2 parameters for robot-nav.service (config/nav.launch.py).
# Copy of the stock nav2_params.yaml sections we run, with our frame
# (base_link, there is no base_footprint in our TF tree), the A1's range and
# no initial pose: the nav bridge asks AMCL for a global localization instead.
#
# amcl and map_server run in localize mode only. The navigation stack below
# (bt_navigator, controller, planner, behaviors, costmaps) runs in both modes:
# while mapping, slam_toolbox's live /map is the global costmap's static layer.
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0 # RPLidar A1 nominal range
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    # a fresh start spreads over the whole map: 2000 particles
    # (the default) was too thin for 40 m2 of floor at every heading
    max_particles: 5000
    min_particles: 1000
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # Recovery off: AMCL sprinkling random particles over the map when the
    # scans stop matching makes it jump to look-alike spots on its own. The
    # nav bridge's search finds a carried robot instead, and hands AMCL the pose.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    random_seed: -1
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    # sharper than the 0.2 default: the map is at 5 cm (0.15 if the particles collapse)
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    introspection_mode: "disabled"
    # correct every 10 cm or 6 degrees, not 25 cm or 11 (the defaults)
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: false

map_server:
  ros__parameters:
    # yaml_filename comes from nav.launch.py (the map named in nav.json)
    introspection_mode: "disabled"

# --- barriers --------------------------------------------------------------
# The barriers drawn on the dashboard reach Nav2 as a keepout mask: a second
# map_server serves the mask image the nav bridge renders (yaml_filename from
# nav.launch.py), costmap_filter_info_server announces it, and the
# keepout_filter in both costmaps below paints its cells in: a thin lethal
# wall along each line, a nearly lethal band around it (robot_nav.py).
filter_mask_server:
  ros__parameters:
    topic_name: "/keepout_mask"
    frame_id: "map"
    introspection_mode: "disabled"

costmap_filter_info_server:
  ros__parameters:
    type: 0 # keepout
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_mask"
    base: 0.0
    multiplier: 1.0
    introspection_mode: "disabled"

# --- navigation ----------------------------------------------------------
# Speeds: gamepad normal is ~0.36 m/s, we navigate at 0.25 m/s and turn at
# 0.8 rad/s. The footprint is the chassis from robot_model.py: 0.060 m ahead
# of the axle, 0.284 m behind it, 0.166 m to each side (tests check the text).
#
# Both halves of Nav2 see the robot as its real rectangle, so they agree on
# what fits. The planner (Smac Lattice) plans poses, not points: it checks the
# footprint at every step and can drive forward to find room before turning.
# The controller (MPPI) tries about a thousand short moves each tick, forward,
# back a little, curving or turning, scores them against the footprint, the
# path and the goal, and drives the best. NavFn (a point) with Regulated Pure
# Pursuit (turn in place first) gave up by an open door and with a table leg
# by the tail, with open floor ahead both times.
#
# Inflation is a preference, not a limit. With the axle 25 cm
# from a wall (8 cm of side clearance) a cell costs about 3.5x open floor,
# at 35 cm about 3x, and from 45 cm nothing. Narrow doorways are allowed;
# the planner just takes the middle of them.
# cmd_vel is remapped to /cmd_vel_nav in nav.launch.py; twist_mux merges it
# behind the gamepad and behind the motion node's /nav_lock.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    filter_duration: 0.3
    default_server_timeout: 20
    default_cancel_timeout: 50
    wait_for_service_timeout: 1000
    introspection_mode: "disabled"
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      enable_groot_monitoring: false
    error_code_name_prefixes:
      - assisted_teleop
      - backup
      - compute_path
      - dock_robot
      - drive_on_heading
      - follow_object
      - follow_path
      - nav_thru_poses
      - nav_to_pose
      - route
      - spin
      - smoother
      - undock_robot
      - wait

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    enable_stamped_cmd_vel: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    path_handler_plugins: ["PathHandler"]
    use_realtime_priority: false
    speed_limit_topic: "speed_limit"
    introspection_mode: "disabled"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.3
      path_length_tolerance: 1.0
    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 2.0
      enforce_path_inversion: false
      enforce_path_rotation: false
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      minimum_rotation_angle: 0.785
      reject_unit_path: false
    FollowPath:
      # The stock MPPI settings, slowed to our speeds and trimmed for the Pi 5:
      # 1000 tries (not 2000) of 3 s each, at the 10 Hz controller rate.
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 30
      model_dt: 0.1
      batch_size: 1000
      open_loop: false
      vx_max: 0.25
      # backing up a little is how it gets out of a tight spot
      vx_min: -0.1
      wz_max: 0.8
      ax_max: 1.0
      ax_min: -1.0
      az_max: 1.5
      vx_std: 0.2
      wz_std: 0.4
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      visualize: false
      publish_optimal_trajectory: false
      regenerate_noises: true
      motion_model: "diff_drive"
      diff_drive:
        plugin: "mppi::DiffDriveMotionModel"
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        # the axle is near the front, so a circle would hide the tail
        consider_footprint: true
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "PreferForwardCritic",
        ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.06, 0.166], [0.06, -0.166], [-0.284, -0.166], [-0.284, 0.166]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      always_send_full_costmap: true
      introspection_mode: "disabled"

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.06, 0.166], [0.06, -0.166], [-0.284, -0.166], [-0.284, 0.166]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      always_send_full_costmap: true
      introspection_mode: "disabled"

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    allow_partial_planning: false
    costmap_update_timeout: 1.0
    introspection_mode: "disabled"
    planner_plugins: ["GridBased"]
    GridBased:
      # The stock Smac Lattice settings with the differential-drive moves
      # (straight, 0.5 m arcs and turns on the spot) instead of its default car moves.
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      lattice_filepath: "/opt/ros/lyrical/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      allow_unknown: true
      tolerance: 0.5
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      coarse_search_resolution: 1
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: false
    introspection_mode: "disabled"
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
      acceleration_limit: 1.0
      deceleration_limit: -1.0
      minimum_speed: 0.10
    # the trip tree's first stuck move (config/nav2_navigate_to_pose.xml)
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      acceleration_limit: 1.0
      deceleration_limit: -1.0
      minimum_speed: 0.10
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.5
