[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-pet"
version = "0.1.0"
description = "Raspberry Pi robot controller services and tools"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "basicmicro",
    "evdev; sys_platform == 'linux'",
    "gpiozero",
    "numpy",
    "openai",
    "pyserial",
    "pyusb",
    "rich",
    "smbus2; sys_platform == 'linux'",
    "adafruit-blinka; sys_platform == 'linux'",
    "adafruit-circuitpython-tca9548a; sys_platform == 'linux'",
    "adafruit-circuitpython-vl53l0x; sys_platform == 'linux'",
    "adafruit-circuitpython-vl53l1x; sys_platform == 'linux'",
    "certifi",
    "sounddevice",
    "textual",
    "websockets",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["config", "control", "drivers", "lib", "telemetry", "voice"]
py-modules = ["gamepad_teleop", "robot_battery", "robot_brain", "robot_camera", "robot_dashboard", "robot_motion", "robot_pi_battery", "robot_sensors", "robot_telemetry", "robot_vision", "robot_voice", "robot_web_dashboard"]
