# twist_mux: merges velocity sources into /cmd_vel for robot-motion.
# Higher priority wins while fresh; a topic goes quiet after `timeout` seconds.
twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      teleop:
        topic: /cmd_vel_teleop
        timeout: 0.5
        priority: 100
      nav:
        # Reserved for Nav2; nothing publishes here yet.
        topic: /cmd_vel_nav
        timeout: 0.5
        priority: 10
